name: braintree_flutter_plus
description: Enhanced Flutter plugin that wraps the native Braintree SDKs with latest updates. Supports iOS 16+, Android 12+, and includes PayPal vault flow fixes.
version: 7.0.1
homepage: https://github.com/adlyyy4/flutter-braintree
repository: https://github.com/adlyyy4/flutter-braintree
issue_tracker: https://github.com/adlyyy4/flutter-braintree/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.10.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.16.0
  web: ^1.1.0

flutter:
  assets:
    - assets/images/

  plugin:
    platforms:
      android:
        package: com.example.flutter_braintree
        pluginClass: FlutterBraintreePlugin
      ios:
        pluginClass: FlutterBraintreePlugin
      web:
        pluginClass: BraintreeFlutterPlusWeb
        fileName: web/braintree_flutter_plus_web.dart
