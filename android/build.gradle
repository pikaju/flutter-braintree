// The Android Gradle Plugin is resolved from the consuming app (via its
// settings.gradle pluginManagement), so this plugin does not pin its own AGP
// version. Using the plugins {} block (instead of the legacy buildscript{} +
// `apply plugin`) keeps it compatible with both AGP 8 and AGP 9 consumers.
plugins {
    id 'com.android.library'
}

group = 'com.example.flutter_braintree'
version = '1.0'

// AGP 9 provides built-in Kotlin; older AGP needs the standalone Kotlin Gradle
// Plugin. Declaring it here (conditionally) also tells the Flutter Gradle tool
// that this module manages its own Kotlin plugin, so it won't force-apply the
// KGP — which would conflict with AGP 9's built-in Kotlin. This is a Java-only
// module, so no Kotlin compiler options are configured.
def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
if (agpMajorVersion < 9) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://cardinalcommerceprod.jfrog.io/artifactory/android"
            credentials {
                username = 'braintree_team_sdk'
                password = 'AKCp8jQcoDy2hxSWhDAUQKXLDPDx6NYRkqrgFLRc3qDrayg6rrCbJpsKKyMwaykVL8FWusJpp'
            }
        }
    }
}

android {
    compileSdk 36

    if (project.android.hasProperty("namespace")) {
        namespace = "com.example.flutter_braintree"
    }

    defaultConfig {
        // Braintree Android SDK v5 requires a minimum of API 23.
        minSdkVersion 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Braintree Android SDK v5 (direct integration). The deprecated `drop-in`
    // library has been removed; the cross-platform Flutter payment sheet drives
    // these modules directly, mirroring the iOS v7 migration.
    def braintreeVersion = '5.13.0'
    implementation "com.braintreepayments.api:card:$braintreeVersion"
    implementation "com.braintreepayments.api:paypal:$braintreeVersion"
    implementation "com.braintreepayments.api:data-collector:$braintreeVersion"
    implementation "com.braintreepayments.api:three-d-secure:$braintreeVersion"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    components.all {
        allVariants {
            withDependencies { deps ->
                deps.each { dep ->
                    if (dep.group == 'net.minidev' && dep.name =='json-smart') {
                        dep.version {
                            prefer "2.3"
                        }
                        dep.because "resolving dependencies issue"
                    }
                }
            }
        }
    }
}
